<form [formGroup]="emotionForm" (ngSubmit)="onSubmit()" class="glass-form" [style.backgroundColor]="selectedColor || 'rgba(255, 255, 255, 0.05)'">
  
  <ng-container *ngIf="!successMessage">
    <div class="emoji-preview">
      {{ selectedEmotion ? emotionEmojis[selectedEmotion] : '😶' }}
    </div>

    <div class="form-group">
      <select formControlName="emotion">
        <option value="" disabled>Select an emotion...</option>
        <option *ngFor="let emotion of emotions" [value]="emotion">{{ emotionEmojis[emotion] }} {{ emotion }}</option>
      </select>
    </div>

    <div class="form-group">
      <input type="text" formControlName="reason" placeholder="Why are you feeling this way?">
    </div>

    <button type="submit" [disabled]="emotionForm.invalid || isSubmitting" [class.tinted]="!!selectedColor" [class.rainbow-gradient]="!selectedEmotion" [style.animationDelay]="randomDelay">
      {{ isSubmitting ? 'Logging...' : 'Log emotion' }}
    </button>
  </ng-container>

  <div class="success-message" *ngIf="successMessage">
    {{ successMessage }}
  </div>
</form>
