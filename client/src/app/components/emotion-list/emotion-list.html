<div class="pageContainer">
  <div *ngIf="deleteSuccess" style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(81, 207, 102, 0.2); border: 1px solid rgba(81, 207, 102, 0.5); color: #51cf66; padding: 10px 20px; border-radius: 20px; z-index: 1000; backdrop-filter: blur(10px); box-shadow: 0 4px 15px rgba(0,0,0,0.3);">
    Entry deleted successfully!
  </div>
  <div class="container">
    <ul class="emotionList">
      <li 
        *ngFor="let emotion of emotions" 
        class="emotionItem" 
        [ngClass]="{'myEmotion': emotion.userId === currentUser?._id}">
        
        <ng-container *ngIf="true">
          <div class="textContainer">
            <span class="text">
              "{{ emotion.text_input }}"
            </span>
            <div class="meta-row">
              <span class="date">
                {{ formatDate(emotion.local_time) }}
                <span *ngIf="emotion.distance !== undefined"> • {{ emotion.distance.toFixed(0) }}km away</span>
              </span>
              <button *ngIf="deletingId !== emotion._id" class="btn-delete" (click)="confirmDelete(emotion._id)" title="Delete Entry">&times;</button>
            </div>
            <div *ngIf="deletingId === emotion._id" style="background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 8px; padding: 10px; margin-top: 10px; text-align: center; width: 100%;">
              <p style="color: #ff6b6b; margin-top: 0; margin-bottom: 10px; font-weight: bold; font-size: 0.9em;">Delete this entry?</p>
              <div style="display: flex; gap: 8px;">
                <button class="btn-secondary" style="flex: 1;" (click)="cancelDelete()">Cancel</button>
                <button class="btn-danger" style="flex: 1;" (click)="deleteEntry(emotion._id)">Delete</button>
              </div>
            </div>
          </div>
          <div class="emotion-icon-container">
            <div class="circle" [style.backgroundColor]="emotionColors[emotion.emotion] || 'gray'">
              <span class="emoji">{{ emotionEmojis[emotion.emotion] || '😶' }}</span>
            </div>
            <span class="emotion-title">{{ emotion.emotion }}</span>
          </div>
        </ng-container>

      </li>
      <li *ngIf="emotions.length === 0" class="text-center w-100 mt-5">
        No emotions logged yet.
      </li>
    </ul>
  </div>
</div>
