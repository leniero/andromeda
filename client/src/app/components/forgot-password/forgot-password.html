<div class="auth-container">
  <div class="glass-card">
    <h2 class="rainbow-text-gradient">Reset Password</h2>
    <p style="text-align: center; color: rgba(255,255,255,0.7); margin-top: -1rem;">Enter your email to receive a reset link.</p>
    
    <div *ngIf="message" style="color: #4ade80; text-align: center;">{{ message }}</div>
    <div *ngIf="error" class="error-msg">{{ error }}</div>

    <form *ngIf="!message" [formGroup]="form" (ngSubmit)="onSubmit()" style="display: flex; flex-direction: column; gap: 1.5rem;">
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" placeholder="astronaut@example.com">
      </div>
      
      <button type="submit" class="btn-primary" [disabled]="form.invalid || isSubmitting">
        {{ isSubmitting ? 'Sending...' : 'Send Reset Link' }}
      </button>
    </form>
    
    <div style="text-align: center;">
      <a routerLink="/login" style="color: rgba(255,255,255,0.7); text-decoration: none; font-size: 0.9rem;">&larr; Back to Login</a>
    </div>
  </div>
</div>
