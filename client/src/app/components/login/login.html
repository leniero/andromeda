<div class="auth-container">
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="glass-card">
    <h2 class="rainbow-text-gradient">Login</h2>
    
    <div class="form-group">
      <label>Email</label>
      <input type="email" formControlName="email" placeholder="Email Address">
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" formControlName="password" placeholder="Password">
    </div>

    <div *ngIf="error" class="error-msg">{{ error }}</div>

    <button type="submit" [disabled]="loginForm.invalid || isSubmitting" class="btn-primary mt-3 rainbow-gradient">
      {{ isSubmitting ? 'Logging in...' : 'Login' }}
    </button>
    
    <div style="display: flex; flex-direction: column; align-items: center; gap: 0.5rem; margin-top: 1rem;">
      <a routerLink="/forgot-password" style="color: rgba(255,255,255,0.7); text-decoration: none; font-size: 0.9rem;">Forgot Password?</a>
      <a routerLink="/signup" style="color: rgba(255,255,255,0.7); text-decoration: none; font-size: 0.9rem;">Don't have an account? Sign Up</a>
    </div>
  </form>
</div>
