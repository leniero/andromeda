<div class="auth-container">
  <div class="glass-card">
    <h2 class="rainbow-text-gradient">Sign Up</h2>

    <div *ngIf="message" style="text-align: center; margin-top: 2rem;">
      <div style="color: #4ade80; margin-bottom: 2rem; font-size: 1.2rem;">
        {{ message }}
      </div>
      <a routerLink="/login" class="btn-primary" style="text-decoration: none; display: inline-block;">Go to Login</a>
    </div>

    <form *ngIf="!message" [formGroup]="signupForm" (ngSubmit)="onSubmit()" style="display: flex; flex-direction: column; gap: 1.5rem;">

    
    <div class="form-group">
      <label>Username</label>
      <input type="text" formControlName="username" placeholder="Username">
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" formControlName="email" placeholder="Email Address">
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" formControlName="password" placeholder="Password">
    </div>

    <div *ngIf="error" class="error-msg">{{ error }}</div>

      <button type="submit" [disabled]="signupForm.invalid || isSubmitting" class="btn-primary rainbow-gradient">
        {{ isSubmitting ? 'Creating account...' : 'Sign Up' }}
      </button>
      
      <div style="text-align: center; margin-top: 1rem;">
        <a routerLink="/login" style="color: rgba(255,255,255,0.7); text-decoration: none; font-size: 0.9rem;">Already have an account? Login</a>
      </div>
    </form>
  </div>
</div>
